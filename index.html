<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Text Playlist Convertor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
        }

        /* ইনপুট এরিয়া */
        .input-section {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            border: 1px solid #334155;
        }

        .url-input-box {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        .url-input-box input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .url-input-box input:focus {
            border-color: #38bdf8;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        .divider {
            color: #94a3b8;
            font-size: 14px;
        }

        .upload-label {
            background: #334155;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px dashed #64748b;
        }

        /* আউটপুট এরিয়া */
        .output-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            display: none; /* শুরুতে হাইড থাকবে */
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .copy-btn {
            background: #22c55e;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .copy-btn:hover {
            background: #16a34a;
        }

        /* টেক্সট বক্স স্টাইল */
        textarea {
            width: 100%;
            height: 450px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>IPTV JSON টু সিরিয়াল টেক্সট কনভার্টার</h2>

    <div class="input-section">
        <div class="url-input-box">
            <input type="url" id="jsonUrl" placeholder="আপনার JSON প্লেলিস্টের URL দিন">
            <button class="btn" onclick="loadJsonFromUrl()">কনভার্ট করুন</button>
        </div>
        <div class="divider">অথবা</div>
        <div>
            <label for="jsonFile" class="upload-label">📂 JSON ফাইল আপলোড করুন</label>
            <input type="file" id="jsonFile" accept=".json" style="display:none;" onchange="loadJsonFromFile(event)">
        </div>
    </div>

    <div class="output-section" id="outputSection">
        <div class="output-header">
            <h3>সাজানো টেক্সট প্লেলিস্ট (m3u ফরম্যাট):</h3>
            <button class="copy-btn" onclick="copyText()">Copy Text</button>
        </div>
        <textarea id="playlistTextArea" readonly></textarea>
    </div>
</div>

<script>
    // URL থেকে ডাটা লোড
    function loadJsonFromUrl() {
        const url = document.getElementById('jsonUrl').value.trim();
        if (!url) { return alert("অনুগ্রহ করে URL দিন।"); }

        fetch(url)
            .then(res => res.json())
            .then(data => generateTextPlaylist(data))
            .catch(err => alert("URL থেকে ডাটা আনা যায়নি। CORS প্রবলেম হতে পারে।"));
    }

    // ফাইল থেকে ডাটা লোড
    function loadJsonFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                generateTextPlaylist(data);
            } catch (err) {
                alert("ভুল JSON ফাইল!");
            }
        };
        reader.readAsText(file);
    }

    // নাম দেখে ফিল্টার ও টেক্সট জেনারেট করার মেইন ফাংশন
    function generateTextPlaylist(channels) {
        // ৫টি ক্যাটাগরি তৈরি
        const categories = {
            sports: [],
            bangla: [],
            indian: [],
            music: [],
            others: []
        };

        // নাম দেখে ফিল্টারিং
        channels.forEach(channel => {
            const channelName = channel.name || channel.title || "Unknown Channel";
            const name = channelName.toLowerCase();

            if (name.includes('sports') || name.includes('sport') || name.includes('t sports') || name.includes('gazi tv') || name.includes('gtv') || name.includes('cricket') || name.includes('football') || name.includes('ten') || name.includes('sony') || name.includes('star sports')) {
                categories.sports.push(channel);
            } 
            else if (name.includes('somoy') || name.includes('jamuna') || name.includes('independent') || name.includes('channel i') || name.includes('atn') || name.includes('ntv') || name.includes('ekattor') || name.includes('bangla') || name.includes('dhaka')) {
                if(name.includes('zee bangla') || name.includes('star jalsha') || name.includes('colors bangla')) {
                    categories.indian.push(channel);
                } else {
                    categories.bangla.push(channel);
                }
            } 
            else if (name.includes('star jalsha') || name.includes('zee bangla') || name.includes('colors bangla') || name.includes('sony aath') || name.includes('star plus') || name.includes('zee tv') || name.includes('india') || name.includes('jalsha')) {
                categories.indian.push(channel);
            } 
            else if (name.includes('music') || name.includes('gaan') || name.includes('sangeet') || name.includes('mtv') || name.includes('b4u')) {
                categories.music.push(channel);
            } 
            else {
                categories.others.push(channel);
            }
        });

        // আপনার পছন্দের সিরিয়াল অর্ডার
        const order = ['sports', 'bangla', 'indian', 'music', 'others'];
        
        // m3u হেডার দিয়ে টেক্সট তৈরি শুরু
        let textResult = "#EXTM3U\n\n";

        order.forEach(catKey => {
            const list = categories[catKey];
            if (list.length > 0) {
                // টেক্সটের মাঝে ক্যাটাগরি চেনার জন্য একটি কমেন্ট বা সেপারেটর
                textResult += `\n#=== ${catKey.toUpperCase()} CHANNELS ===\n`;

                list.forEach(channel => {
                    const cName = channel.name || channel.title || "Unknown";
                    const logo = channel.logo || channel.image || channel.logo_url || "";
                    const url = channel.url || channel.link || channel.stream_url || "";

                    // স্ট্যান্ডার্ড IPTV m3u টেক্সট ফরম্যাট তৈরি
                    textResult += `#EXTINF:-1 tvg-logo="${logo}" group-title="${catKey}",${cName}\n${url}\n`;
                });
            }
        });

        // টেক্সট বক্সে ডাটা শো করানো
        const outputSection = document.getElementById('outputSection');
        const textArea = document.getElementById('playlistTextArea');
        
        textArea.value = textResult;
        outputSection.style.display = 'block'; // টেক্সট বক্সটি স্ক্রিনে দৃশ্যমান করা
        outputSection.scrollIntoView({ behavior: 'smooth' });
    }

    // টেক্সট কপি করার ফাংশন
    function copyText() {
        const textArea = document.getElementById('playlistTextArea');
        textArea.select();
        textArea.setSelectionRange(0, 99999); // মোবাইল ডিভাইসের জন্য
        navigator.clipboard.writeText(textArea.value);
        alert("পুরো টেক্সট প্লেলিস্টটি কপি হয়েছে!");
    }
</script>

</body>
</html>
