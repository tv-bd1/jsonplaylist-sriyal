<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON IPTV অটো ক্যাটাগরি ও সিরিয়াল প্লেয়ার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* ফাইল আপলোডার স্টাইল */
        .upload-section {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed #00ffcc;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: #00ffcc;
            color: #000;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .upload-btn:hover {
            box-shadow: 0 0 20px #00ffcc;
            transform: scale(1.05);
        }

        /* ক্যাটাগরি সেকশন হেডারের স্টাইল */
        .category-block {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 20px;
            color: #ff007f;
            border-bottom: 2px solid rgba(255, 0, 127, 0.3);
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title span {
            background: rgba(255, 0, 127, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 14px;
            color: #fff;
        }

        /* চ্যানেল গ্রিড */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        /* চ্যানেল কার্ড */
        .channel-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .channel-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .channel-logo {
            width: 65px;
            height: 65px;
            background: #121926;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .channel-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>IPTV অটো ক্যাটাগরি প্লেলিস্ট জেনারেটর</h2>

    <!-- ফাইল আপলোড এরিয়া -->
    <div class="upload-section">
        <p style="margin-bottom: 15px; color: #aaa;">আপনার ক্যাটাগরি ছাড়া JSON ফাইলটি এখানে আপলোড করুন</p>
        <label for="jsonFile" class="upload-btn">JSON ফাইল সিলেক্ট করুন</label>
        <input type="file" id="jsonFile" accept=".json">
    </div>

    <!-- এখানে ক্যাটাগরি অনুযায়ী চ্যানেলগুলো সিরিয়ালি লোড হবে -->
    <div id="playlistContainer"></div>
</div>

<script>
    document.getElementById('jsonFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const channels = JSON.parse(e.target.result);
                processAndRenderChannels(channels);
            } catch (error) {
                alert("দুঃখিত! সঠিক JSON ফাইল আপলোড করুন।");
            }
        };
        reader.readAsText(file);
    });

    function processAndRenderChannels(channels) {
        // ৫টি ক্যাটাগরির খালি অ্যারে বা লিস্ট তৈরি
        const categories = {
            sports: { title: "⚽ স্পোর্টস চ্যানেল (Sports)", list: [] },
            bangla: { title: "🇧🇩 বাংলা চ্যানেল (Bangla Channels)", list: [] },
            indian: { title: "🇮🇳 ইন্ডিয়ান চ্যানেল (Indian Channels)", list: [] },
            music: { title: "🎵 মিউজিক চ্যানেল (Music)", list: [] },
            others: { title: "📺 অন্যান্য চ্যানেল (Others)", list: [] }
        };

        // প্রতিটি চ্যানেলের নাম চেক করে ক্যাটাগরিতে ভাগ করার লজিক (Keywords)
        channels.forEach(channel => {
            const name = channel.name.toLowerCase();

            if (name.includes('sports') || name.includes('sport') || name.includes('t sports') || name.includes('gazi tv') || name.includes('gtv') || name.includes('cricket') || name.includes('football') || name.includes('sony ten') || name.includes('star sports')) {
                categories.sports.list.push(channel);
            } 
            else if (name.includes('somoy') || name.includes('jamuna') || name.includes('independent') || name.includes('channel i') || name.includes('atn') || name.includes('ntv') || name.includes('rttv') || name.includes('bangla') || name.includes('dhaka')) {
                categories.bangla.list.push(channel);
            } 
            else if (name.includes('star jalsha') || name.includes('zee bangla') || name.includes('colors bangla') || name.includes('sony aath') || name.includes('star plus') || name.includes('zee tv') || name.includes('india')) {
                categories.indian.list.push(channel);
            } 
            else if (name.includes('music') || name.includes('gaan') || name.includes('sangeet') || name.includes('m tv') || name.includes('vh1') || name.includes('b4u')) {
                categories.music.list.push(channel);
            } 
            else {
                categories.others.list.push(channel);
            }
        });

        // আপনার দেওয়া সিরিয়াল অনুযায়ী স্ক্রিনে রেন্ডার বা সাজানো
        const container = document.getElementById('playlistContainer');
        container.innerHTML = ''; // আগের ডাটা ক্লিয়ার করা

        // আপনার নির্দিষ্ট করা সিরিয়াল অর্ডার
        const order = ['sports', 'bangla', 'indian', 'music', 'others'];

        order.forEach(catKey => {
            const cat = categories[catKey];
            if (cat.list.length > 0) {
                // ক্যাটাগরি ব্লক তৈরি
                const catBlock = document.createElement('div');
                catBlock.className = 'category-block';

                // ক্যাটাগরি হেডার
                catBlock.innerHTML = `
                    <div class="category-title">
                        ${cat.title} <span>${cat.list.length}টি</span>
                    </div>
                    <div class="channel-grid" id="grid-${catKey}"></div>
                `;
                container.appendChild(catBlock);

                // চ্যানেলের কার্ডগুলো গ্রিডের ভেতর পুশ করা
                const grid = document.getElementById(`grid-${catKey}`);
                cat.list.forEach(channel => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    // আপনার JSON স্ট্রাকচার অনুযায়ী লোগো এবং ইউআরএল কী (Key) সেট করবেন
                    const logo = channel.logo || channel.image || '📺'; 
                    const url = channel.url || channel.link || '';

                    card.onclick = () => playChannel(url, channel.name);

                    card.innerHTML = `
                        <div class="channel-logo">${logo.startsWith('http') ? `<img src="${logo}" width="100%" style="border-radius:50%">` : logo}</div>
                        <div class="channel-name">${channel.name}</div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    }

    // চ্যানেল প্লে করার ফাংশন
    function playChannel(url, name) {
        alert(`প্লে হচ্ছে: ${name}\nলিংক: ${url}`);
        // এখানে আপনার নির্দিষ্ট প্লেয়ার (যেমন Video.js বা ExoPlayer এর জন্য ইন্টারফেস) যুক্ত করতে পারেন।
    }
</script>

</body>
</html>
